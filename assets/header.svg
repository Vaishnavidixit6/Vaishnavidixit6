<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Vaishnavi Dixit</title>
  <desc id="description">Animated Lumos-themed profile header</desc>
  <defs>
    <filter id="softGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="#0B1026"/>

  <g fill="#F7F3E8">
    <circle cx="88" cy="38" r="1" opacity="0.40"/>
    <circle cx="167" cy="104" r="1.4" opacity="0.26"/>
    <circle cx="263" cy="29" r="0.8" opacity="0.48"/>
    <circle cx="318" cy="178" r="1.1" opacity="0.24"/>
    <circle cx="405" cy="115" r="0.7" opacity="0.32"/>
    <circle cx="493" cy="23" r="1.2" opacity="0.34"/>
    <circle cx="716" cy="31" r="0.9" opacity="0.38"/>
    <circle cx="802" cy="162" r="1.3" opacity="0.25"/>
    <circle cx="881" cy="94" r="0.8" opacity="0.42"/>
    <circle cx="959" cy="27" r="1.1" opacity="0.30"/>
    <circle cx="1064" cy="126" r="1.4" opacity="0.27"/>
    <circle cx="1130" cy="51" r="0.9" opacity="0.44"/>
    <circle cx="109" cy="189" r="0.7" opacity="0.34"/>
    <circle cx="228" cy="143" r="0.9" opacity="0.28"/>
    <circle cx="990" cy="191" r="1" opacity="0.35"/>
    <circle cx="1152" cy="177" r="0.8" opacity="0.31"/>
  </g>
  <g fill="#D4AF37">
    <circle cx="137" cy="71" r="0.8" opacity="0.42"/>
    <circle cx="343" cy="52" r="0.7" opacity="0.38"/>
    <circle cx="852" cy="42" r="0.8" opacity="0.40"/>
    <circle cx="1051" cy="167" r="0.7" opacity="0.35"/>
  </g>

  <line x1="370" y1="54" x2="830" y2="54" stroke="#D4AF37" stroke-width="1" stroke-dasharray="460" stroke-dashoffset="460">
    <animate attributeName="stroke-dashoffset" from="460" to="0" dur="1.3s" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="0s" fill="freeze"/>
  </line>

  <text x="600" y="92" text-anchor="middle" fill="#D4AF37" filter="url(#softGlow)"
        font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="9" opacity="0">LUMOS
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="0.5s" fill="freeze"/>
  </text>

  <text x="600" y="151" text-anchor="middle" fill="#F7F3E8"
        font-family="Georgia, 'Times New Roman', serif" font-size="48" opacity="0">Vaishnavi Dixit
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="3.7s" fill="freeze"/>
    <animate attributeName="y" from="158" to="151" dur="1.1s" begin="3.7s" fill="freeze"/>
  </text>

  <text x="600" y="187" text-anchor="middle" fill="#C9C8C2"
        font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.5" opacity="0">DATA SCIENCE · HEALTHCARE AI · MACHINE LEARNING
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="4.5s" fill="freeze"/>
  </text>
</svg>
