        stroke="url(#sparkGradient)" stroke-width="2" fill="none" stroke-linecap="round"
        stroke-dasharray="600" stroke-dashoffset="600">
    <animate attributeName="stroke-dashoffset" from="600" to="0" dur="2s" fill="freeze"/>
  </path>

  <!-- Spark at the tip -->
  <circle r="3.5" fill="#ffd700" filter="url(#glow)">
    <animateMotion dur="2s" fill="freeze">
      <mpath href="#wandPath"/>
    </animateMotion>
  </circle>

