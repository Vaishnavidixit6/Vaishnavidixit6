name: generate basilisk snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate basilisk-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Vaishnavidixit6
          outputs: |
            dist/basilisk-snake.svg?color_snake=%23D4AF37,%2340916C,%232D6A4F,%231B4332,%230B1026&color_dots=%230B1026,%231B4332,%232D6A4F,%2340916C,%23D4AF37&color_empty=%230B1026
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}