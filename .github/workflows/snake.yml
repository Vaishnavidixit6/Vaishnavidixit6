name: generate basilisk snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate basilisk-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Vaishnavidixit6
          outputs: |
            dist/basilisk-snake.svg?color_snake=#40916C&color_dots=#0B1026,#1B4332,#2D6A4F,#40916C,#52B788
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}